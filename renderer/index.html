<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Milky Client</title>

<style>
:root{--bg:#0b0b0c;--panel:#151516;--line:#2a2a2c;--tx:#f2f2f2;--mu:#8d8d92;--ac:#e8e8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.4 "Trebuchet MS",system-ui,sans-serif;display:flex;overflow:hidden}

.logo{font-weight:800;letter-spacing:3px;font-size:17px;margin-bottom:10px}.logo small{display:block;color:var(--mu);font-size:10px;letter-spacing:2px}
.nav{background:none;border:0;color:var(--mu);text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit}
.nav:hover,.nav.on{background:#262628;color:var(--tx)}
.sec{font-size:10px;letter-spacing:2px;color:#5d5d62;margin:10px 4px 2px}
main{flex:1;position:relative;overflow-y:auto;min-width:0}
#petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 0,#2b2b2e,#0b0b0c 70%)}
.p{position:absolute;top:-20px;width:10px;height:7px;background:#ddd;border-radius:80% 0;opacity:.5;animation:f linear infinite}
@keyframes f{to{transform:translate(90px,110vh) rotate(540deg)}}
.pg{position:relative;padding:22px;max-width:980px;margin:auto}
h1{margin:0 0 4px;font-size:28px}.mu{color:var(--mu)}
input,select,button.b{background:#1b1b1d;border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:9px 12px;font:inherit}
input{width:100%;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.play{background:#f2f2f2;color:#0b0b0c;border:0;border-radius:12px;padding:14px 46px;font-weight:800;letter-spacing:3px;cursor:pointer;font-size:16px}
.card{background:rgba(21,21,22,.88);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.chip{display:inline-block;background:#262628;border-radius:20px;padding:3px 10px;margin:2px;font-size:12px}
.book{display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,#1c1c1e,#131314);border:1px solid var(--line);border-left:8px solid #d8d8d8;border-radius:6px 12px 12px 6px;padding:14px;margin-bottom:10px}
.book h3{margin:0;font-size:16px}.book .ic{width:44px;height:56px;background:#2d2d30;border-radius:4px;display:grid;place-items:center;font-weight:800}
.book button{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.skin{text-align:center;cursor:pointer}.skin .fig{height:150px;background:#1b1b1d;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;margin-bottom:6px}
.skin.on .fig{border-color:#fff;box-shadow:0 0 0 2px #fff4}
.char{width:34px;height:96px;background:linear-gradient(#cfcfcf 0 30%,#777 30% 65%,#444 65%)}
.tiles{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:40px 0}
.tile{width:130px;height:150px;background:#ffffff14;border:1px solid #ffffff55;border-radius:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);text-align:center;padding-top:30px}
.tile:hover{background:#ffffff30}.small .tile{width:110px;height:80px;padding-top:10px}
#esc{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:9}#esc.on{display:grid}
@media(max-width:640px){body{flex-direction:column}aside{width:100%;flex-direction:row;overflow-x:auto;height:auto}.sec,.logo small{display:none}.nav{white-space:nowrap}}
#petals{background:linear-gradient(#0b0b0cb8,#0b0b0ce6),var(--bgimg,url(bg2.webp)) center/cover!important}.p{display:none}.sk{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}@media(max-width:900px){.sk{grid-template-columns:1fr}}
.vw{background:linear-gradient(#17171a,#0d0d0e);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.seg{display:inline-flex;gap:2px;background:#0d0d0e;border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 6px 6px 0}
.seg button{background:none;border:0;color:var(--mu);padding:7px 12px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.seg button.on{background:#3a3a3e;color:#fff}
.stage{height:360px;perspective:900px;position:relative;cursor:grab;overflow:hidden;touch-action:none}
.rig,.bob{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.pt{position:absolute;transform-style:preserve-3d}.fc{position:absolute;image-rendering:pixelated;backface-visibility:hidden}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.sc{background:#1a1a1c;border:1px solid var(--line);border-radius:14px;padding:12px 6px 8px;text-align:center;cursor:pointer}.sc.on{border-color:#fff;box-shadow:0 0 0 1px #fff}
.sc img{height:112px;image-rendering:pixelated}.sc b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.wb{width:100%;padding:14px;border:0;border-radius:12px;background:#f2f2f2;color:#0b0b0c;font:inherit;font-weight:800;cursor:pointer}.wb:disabled{background:#3a3a3e;color:#8d8d92;cursor:default}
body{flex-direction:column}

.logo{margin:0 16px 0 0;white-space:nowrap}.logo small,.sec{display:none}
.nav{white-space:nowrap;border-radius:20px;padding:8px 14px}.nav.on{background:#f2f2f2;color:#0b0b0c}

#petals{background:#0b0b0c!important}

@keyframes kb{from{transform:scale(1.0) translate(-1.5%,-1%)}to{transform:scale(1.07) translate(1.5%,1%)}}
.p{display:block!important;z-index:2;opacity:.45;background:#fff}
.card:not(#toast){background:linear-gradient(180deg,#19191bf2 0%,#3b3b3ef2 45%,#d4d4d7f2 100%)}
.card:not(#toast) .mu{color:#cfcfd3}

.pg{z-index:3}
.card:not(#toast) b{text-shadow:0 1px 4px #000c}
